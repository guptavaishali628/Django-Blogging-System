{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Django Blogs</title>
    <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
    <style>
      .error-code {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 7rem;
        font-weight: 900;
        line-height: 1;
      }
      .error-box {
        background-color: #f8f9fa;
        border: 1px dashed #6c757d;
      }
    </style>
</head>
<body>
    <div class="container">
      <!-- header -->
      <header class="blog-header py-3">
        <div class="row flex-nowrap justify-content-between align-items-center">
          <div class="col-8 pt-1">
            <a class="blog-header-logo text-dark" href="/">Django Blog</a>
          </div>
          <div class="col-4 d-flex justify-content-end align-items-center">
            <a class="btn btn-sm btn-warning" href="#">Login</a> &nbsp;
            <a class="btn btn-sm btn-outline-secondary" href="#">Register</a>
          </div>
        </div>
      </header>

      <hr class="my-4" style="border-top: 1px solid #cccccc;">

      <!-- 404 Error Content -->
      <div class="row justify-content-center my-5 py-4">
        <div class="col-md-8 text-center">
          <div class="error-box p-5 rounded">
            <!-- 404 Title -->
            <h1 class="error-code text-warning mb-2">404</h1>
            <h3 class="text-uppercase text-dark mb-3" style="letter-spacing: 2px;">Page Not Found</h3>

            <!-- Message -->
            <p class="lead font-italic my-4" style="color: #495057;">
              The category or page you are looking for does not exist or has been moved.
            </p>

            <hr class="w-50 mx-auto my-4" style="border-top: 1px solid #cccccc;">

            <!-- Back to Home Button -->
            <a href="/" class="btn btn-warning px-4 py-2 font-weight-bold">
              &larr; Back to Home
            </a>
          </div>
        </div>
      </div>

    </div>

    <!-- Divider before footer -->
    <hr class="my-4" style="border-top: 1px solid #cccccc;">

    <!-- Footer -->
    <footer class="blog-footer text-center pb-4">
      <p>Django blog built with ❤️ by <a href="#">Rathan Kumar</a></p>
    </footer>
</body>
</html>
