{% extends 'base.html'%}

{% block content%}

    <style>
      .error-code {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 7rem;
        font-weight: 900;
        line-height: 1;
      }
      .error-box {
        background-color: #f8f9fa;
        border: 1px dashed #6c757d;
      }
    </style>

      <!-- 404 Error Content -->
      <div class="row justify-content-center my-5 py-4">
        <div class="col-md-8 text-center">
          <div class="error-box p-5 rounded">
            <!-- 404 Title -->
            <h1 class="error-code text-warning mb-2">404</h1>
            <h3 class="text-uppercase text-dark mb-3" style="letter-spacing: 2px;">Page Not Found</h3>

            <!-- Message -->
            <p class="lead font-italic my-4" style="color: #495057;">
              The category or page you are looking for does not exist or has been moved.
            </p>

            <hr class="w-50 mx-auto my-4" style="border-top: 1px solid #cccccc;">

            <!-- Back to Home Button -->
            <a href="/" class="btn btn-warning px-4 py-2 font-weight-bold">
              &larr; Back to Home
            </a>
          </div>
        </div>
      </div>
    </div>
 {% endblock %}
