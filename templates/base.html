<!-------------------Header Part------------------>
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Blogs</title>
    <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="container">
      <header class="blog-header py-3">
        <div class="row align-items-center">
          
          <!-- logo section -->
          <div class="col-6 col-md-3">
            <a href="/" class="d-inline-block">
              <img src="{% static 'images/logo.jpeg' %}" 
                   alt="The Paperless Press" 
                   style="height: 65px; max-width: 100%; object-fit: contain;">
            </a>
          </div>

          <!-- auth buttons -->
          <div class="col-6 col-md-4 order-md-3 d-flex justify-content-end align-items-center">
            {% if not user.is_authenticated %}
              <a class="btn btn-sm btn-warning font-weight-bold mr-2 text-nowrap" href="{% url 'login' %}">Login</a>
              <a class="btn btn-sm btn-outline-secondary text-nowrap" href="{% url 'register' %}">Register</a>
            {% else %}
              <a class="btn btn-sm btn-warning font-weight-bold mr-2 text-nowrap" href="{% url 'dashboard' %}">Dashboard</a>
              <a class="btn btn-sm btn-warning font-weight-bold text-nowrap" href="{% url 'logout' %}">Logout</a>
            {% endif %}
          </div>

          <!-- search section -->
          <div class="col-12 col-md-5 order-md-2 mt-3 mt-md-0">
            <form action="{% url 'search' %}" method="GET" class="m-0">
              <div class="input-group">
                <input type="text" 
                       class="form-control"
                       name="keyword"
                       value="{{ keyword }}"  
                       placeholder="Search stories..." 
                       style="height: 42px; border-radius: 4px 0 0 4px; border: 1.5px solid #ced4da;">
                <div class="input-group-append">
                  <button class="btn btn-warning" 
                          type="submit" 
                          style="height: 42px; padding: 0 16px; border-radius: 0 4px 4px 0; font-weight: 600;">
                    🔍︎
                  </button>
                </div>
              </div>
            </form>
          </div>

        </div>
      </header>

      <hr class="my-4" style="border-top: 1px solid #cccccc;">

      <div class="nav-scroller py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
          {% for cat in categories %}
          <a class="px-3 py-2 text-dark font-weight-bold" 
            href="{% url 'posts_by_category' cat.id %}" 
            style="font-size: 1.05rem; border-radius: 8px; text-decoration: none; transition: background 0.2s ease;" 
            onmouseover="this.style.backgroundColor='#e9ecef';" 
            onmouseout="this.style.backgroundColor='transparent';">
               {{cat.category_name}}
          </a>
          {% endfor %}
        </nav>
      </div>

<!--------------------main content---------------->
{% block content %}

{% endblock %}

<!--------------------Footer Part------------------>
<hr class="my-4" style="border-top: 1px solid #cccccc;">
   
<footer class="blog-footer text-center">
  <p>Django blog built with ❤️ by <a href="#">Vaishali Gupta</a></p>
</footer>
</body>
</html>
