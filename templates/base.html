<!-------------------Header Part------------------>
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Blogs</title>
    <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Playfair+Display:700,900" rel="stylesheet">
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
  </head>
<body>
    <div class="container">
      <header class="blog-header py-3">
        <div class="row flex-nowrap justify-content-between align-items-center">
          <!-- logo section -->
         <div class="col-4 pt-1">
            <a href="/" class="d-inline-block">
              <img src="{% static 'images/logo.jpeg' %}" 
                   alt="The Paperless Press" 
                   style="height: 115px; max-width: 100%; object-fit: contain;">
            </a>
          </div>
          <!-- search section -->
          <div class="card mb-4 border-0 shadow-sm" style="background-color: #f8f9fa; margin-top: 20px;">
            <form action="{% url 'search' %}" method="GET" style="margin-top: 8px;">  <!-- sarch url from urls.py-->
              <div class="input-group">
                <!-- Input Field -->
               <!-- this is the name='keyword' which we want to search -->
                <input type="text" 
                      class="form-control"
                      name="keyword"
                      value="{{ keyword }}"  
                      placeholder="Search stories..." 
                      style="height: 49px; font-size: 1rem; padding: 23px 45px; border-radius: 4px 0 0 4px; border: 1.5px solid #ced4da;">
                
                <!-- Go Button -->
                <div class="input-group-append">
                  <button class="btn btn-warning" 
                          type="submit" 
                          style="height: 49px; font-size: 1rem; font-weight: 600; padding: 0 22px; border-radius:  0 4px 4px 0;">
                    🔍︎
                  </button>
                </div>
              </div>
            </form>
          </div>

          <!-- auth buttons -->

          <div class="col-4 d-flex justify-content-end align-items-center">
            <a class="btn btn-sm btn-warning font-weight-bold px-3 py-2" href="#">Login</a> &nbsp;
            <a class="btn btn-sm btn-outline-secondary px-3 py-2" href="#">Register</a>
          </div>
        </div>
      </header>

      <hr class="my-4" style="border-top: 1px solid #cccccc;">

      <div class="nav-scroller py-1 mb-2">
        <nav class="nav d-flex justify-content-between">
          {% for cat in categories %}
          <a class="px-3 py-2 text-dark font-weight-bold" 
            href="{% url 'posts_by_category' cat.id %}" 
            style="font-size: 1.05rem; border-radius: 8px; text-decoration: none; transition: background 0.2s ease;" 
            onmouseover="this.style.backgroundColor='#e9ecef';" 
            onmouseout="this.style.backgroundColor='transparent';">
               {{cat.category_name}}
          </a>
          {% endfor %}
        </nav>
      </div>

<!--------------------main content---------------->
{% block content %}

{% endblock %}

<!--------------------Footer Part------------------>
<hr class="my-4" style="border-top: 1px solid #cccccc;">
   
<footer class="blog-footer text-center">
  <p>Django blog built with ❤️ by <a href="#">Rathan Kumar</a></p>
</footer>
</body>
</html>
