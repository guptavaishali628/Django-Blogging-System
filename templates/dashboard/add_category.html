{% extends 'base.html' %}
{% block content %}

<!-- load crispy form tags -->
{% load crispy_forms_tags %}

<style>
    .custom-form .form-control:focus,
    .custom-form .custom-select:focus,
    .custom-form input:focus,
    .custom-form textarea:focus {
        border-color: #ffc107 !important;
        box-shadow: 0 0 0 0.2rem rgba(255, 193, 7, 0.25) !important;
        outline: none;
    }
    .custom-form .form-group label {
        font-weight: 600 !important;
        font-size: 0.95rem;
        color: #343a40;
    }
</style>

<div class="row">
    <!-- Left sidebar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right side content -->
    <div class="col-md-9 mb-4">
        
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
                <h3 class="font-weight-bold text-dark m-0">Add New Category</h3>
                <small class="text-muted">Create a new category for your blog posts</small>
            </div> 
            <a href="{% url 'categories' %}" class="btn btn-outline-secondary font-weight-bold shadow-sm px-3 py-2" style="border-radius: 6px;">
                <i class="fa fa-arrow-left mr-1"></i> Back to Categories
            </a>  
        </div> 
        <!-- Form part -->
         <!-- Form Part -->
        <div class="card mx-auto custom-form border-0 shadow-sm rounded-lg p-4 bg-white" style=" max-width: 600px; border-top: 3px solid #ffc107 !important ;">
            <form action="{% url 'add_category' %}" method="POST">
                {% csrf_token %}
                {{form | crispy}}
                <button type="submit" class="btn-warning font-weight-bold text-dark px-4 py-2 mt-2 shadow-sm" style="border-radius: 6px;">
                    <i class="fa fa-check mr-1"></i>Submit
                </button>
            </form>
        </div> 
    </div>       
</div>
{% endblock %}
