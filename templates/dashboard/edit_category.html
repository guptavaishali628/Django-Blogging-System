<!----------------------------- copy add_category.html--------------------------->

{% extends 'base.html' %}
{% block content %}

<!-- load crispy form tags -->
{% load crispy_forms_tags %}

<div class="row">
    <!-- Left sidebar -->
    {% include 'dashboard/sidebar.html' %}

    <!-- Right side content -->
    <div class="col-md-9 mb-4">
        
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
                <h3 class="font-weight-bold text-dark m-0">Edit Category</h3>
                <small class="text-muted">Update the category for your blog posts</small>
            </div> 
            <a href="{% url 'categories' %}" class="btn btn-outline-secondary font-weight-bold shadow-sm px-3 py-2" style="border-radius: 6px;">
                <i class="fa fa-arrow-left mr-1"></i> Back to Categories
            </a>  
        </div> 
        <!-- Form part -->
         <!-- Form Part -->
        <div class="card border-0 shadow-sm rounded-lg p-4 bg-white" style="border-top: 3px solid #ffc107 !important;">
            <form action="{% url 'edit_category' category.id %}" method="POST">
                {% csrf_token %}
                {{form | crispy}}
                <button type="submit" class="btn-warning font-weight-bold text-dark px-4 py-2 mt-2 shadow-sm" style="border-radius: 6px;">
                    <i class="fa fa-check mr-1"></i>Submit
                </button>
            </form>
        </div> 
    </div>       
</div>
{% endblock %}
