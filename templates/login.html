{% extends 'base.html' %}
<!-- load crispy tags -->
{% load crispy_forms_tags %}

{% block content %}
<style>
    .auth-wrapper {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .auth-card {
        border-radius: 18px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        background: #ffffff;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.07);
    }
    .auth-icon-badge {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: #fff8e6;
        color: #ffc107;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 12px;
    }

    /* Font sizes & inputs */
    .auth-card h2 {
        font-size: 1.85rem;
    }
    .auth-card .subtitle {
        font-size: 1.05rem;
    }
    .auth-card label {
        font-size: 1.02rem;
        font-weight: 500;
        margin-bottom: 6px;
        color: #2d3748;
    }
    .auth-card input.form-control,
    .auth-card select.form-select {
        font-size: 1.05rem;
        padding: 12px 16px;
        border-radius: 9px;
        border: 1px solid #d1d5db;
    }
    .auth-card input.form-control:focus,
    .auth-card select.form-select:focus {
        border-color: #ffc107;
        box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
    }
    .auth-card .form-text, 
    .auth-card .help-block {
        font-size: 0.9rem;
    }

    /* Button */
    .btn-brand {
        background-color: #ffc107;
        border: none;
        color: #212529;
        font-size: 1.15rem;
        font-weight: 600;
        padding: 13px;
        border-radius: 10px;
        transition: all 0.3s ease;
    }
    .btn-brand:hover {
        background-color: #e0a800;
        color: #111;
        box-shadow: 0 4px 14px rgba(255, 193, 7, 0.35);
        transform: translateY(-1px);
    }
    .auth-footer-text {
        font-size: 1rem;
    }
    .forgot-link {
        font-size: 0.92rem;
        color: #4a5568;
        transition: color 0.2s ease;
    }
    .forgot-link:hover {
        color: #d39e00;
    }
</style>

<div class="container py-4 auth-wrapper">
    <div class="col-12 col-sm-11 col-md-9 col-lg-6" style="max-width: 520px;">
        <div class="card auth-card p-4 p-sm-5">
            <div class="card-body p-0">
                
                <!-- Header -->
                <div class="text-center mb-4">
                    <div class="auth-icon-badge">
                        <span>🔐</span>
                    </div>
                    <h2 class="fw-bold mb-2 text-dark">Log In</h2>
                    <p class="text-muted subtitle">Enter your credentials to access your account.</p>
                </div>

                <!-- Form -->
                <form method="POST" action="{% url 'login' %}">
                    <!-- include csrf token -->
                    {% csrf_token %}

                    <div class="mb-2">
                        <!-- crispy include here -->
                        {{ form|crispy }} 
                    </div>

                    <!-- Forgot Password Link -->
                    <div class="d-flex justify-content-end mb-3">
                        <a href="{% url 'reset_pass' %}" class="text-decoration-none fw-semibold forgot-link">
                            Forgot password?
                        </a>
                    </div>

                    <div class="d-grid mt-2">
                        <button type="submit" class="btn btn-brand">
                            Submit
                        </button>
                    </div>
                </form>

                <!-- Footer Link -->
                <div class="text-center mt-4 pt-3 border-top auth-footer-text">
                    <span class="text-muted">Don't have an account?</span>
                    <a href="{% url 'register' %}" class="fw-bold text-decoration-none text-dark ms-1">
                        Register
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
